<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project coordinator status</title>
<style>
:root{color-scheme:light dark}body{font:15px system-ui,sans-serif;max-width:1400px;margin:2rem auto;padding:0 1rem;color:CanvasText;background:Canvas}input,button,select{font:inherit;padding:.45rem}button{margin:.25rem}a{color:#4b8ed8}.muted{opacity:.72}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}section,article,details{border:1px solid #8886;border-radius:.5rem;padding:.8rem;margin:.5rem 0}summary{cursor:pointer;font-weight:600}#detail:focus{outline:2px solid #4b8ed8;outline-offset:2px}svg{width:100%;min-height:250px;border:1px solid #8886;border-radius:.5rem}svg text{font:12px system-ui,sans-serif;fill:CanvasText}.edge{stroke:#778;stroke-width:1.5}.task-node{fill:#4b8ed8}.ref-node{fill:#659968}.meta-node{fill:#a67ac8}.node-label{font-size:11px}.badge{padding:.1rem .4rem;border:1px solid #8888;border-radius:1rem}.bad{color:#ce5656}.good{color:#3b9b64}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<h1>Project coordinator status</h1>
<p class="muted">Live project/task graph and participant evidence. Reports are observations; Root acceptance remains separate.</p>
<label>API bearer token <input id="token" type="password" autocomplete="off"></label>
<button id="refresh">Refresh</button>
<p id="freshness" class="muted" aria-live="polite">Not yet loaded.</p>
<main id="view"></main>
<section id="routing"><h2>Saved routing policy</h2><p id="routing-state" aria-live="polite">Loading support state…</p><label>Model <select id="routing-model" disabled></select></label><label>Effort <select id="routing-effort" disabled></select></label><button id="routing-save" disabled>Save model and effort</button></section>
<script>
const token=document.querySelector('#token'),view=document.querySelector('#view'),freshness=document.querySelector('#freshness');
let taskOffset=0,reportOffset=0,projectReportOffset=0,selectedTask='';
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
async function api(path){const r=await fetch(path,{headers:{Authorization:`Bearer ${token.value}`},cache:'no-store'});if(!r.ok)throw Error(`API returned ${r.status}`);return r.json()}
async function loadRouting(outcome=''){
 const state=document.querySelector('#routing-state'),model=document.querySelector('#routing-model'),effort=document.querySelector('#routing-effort'),save=document.querySelector('#routing-save');
 try{
  const data=await api('/api/routing-policy'),supported=Boolean(data.support?.combined_supported),repairable=Boolean(data.support?.capability_supported&&data.support?.selection_repairable),selectable=supported||repairable;
  const supportMessage=repairable?'Consumer and capabilities support the permitted pairs, but the saved selection is outside the current ceiling. Choose a permitted pair to repair it; execution remains unsupported until then.':supported?'Saved policy is supported.':'Combined model and effort saving is unsupported by the installed consumer.';
  state.textContent=outcome?`${outcome} ${supportMessage}`:supportMessage;
  const choices=data.support?.models||{};
  model.replaceChildren(...Object.keys(choices).map(value=>new Option(value,value)));
  const updateEfforts=()=>effort.replaceChildren(...(choices[model.value]||[]).map(value=>new Option(value,value)));
  model.onchange=updateEfforts;
  model.value=choices[data.policy?.model]?data.policy.model:Object.keys(choices)[0]||'';
  updateEfforts();effort.value=(choices[model.value]||[]).includes(data.policy?.effort)?data.policy.effort:effort.options[0]?.value||'';
  model.disabled=effort.disabled=save.disabled=!selectable;
  save.onclick=async()=>{
   save.disabled=true;
   try{
    const response=await fetch('/api/routing-policy',{method:'POST',headers:{Authorization:`Bearer ${token.value}`,'Content-Type':'application/json'},body:JSON.stringify({revision:data.revision,model:model.value,effort:effort.value})});
    const result=await response.json();
    const conflict=result.state==='failed'&&result.error==='revision conflict';
    const outcome=response.ok&&result.state==='saved'&&result.saved===true&&typeof result.applied==='boolean'
     ?`Saved. Applied: ${result.applied?'yes':'no'}.`
     :`Save ${conflict?'conflicted':result.state||'failed'}${result.error?`: ${result.error}`:''}.`;
    await loadRouting(outcome);
   }catch(error){state.textContent=error.message;save.disabled=true}
  };
 }catch(e){state.textContent=outcome?`${outcome} Refresh failed: ${e.message}`:e.message;save.disabled=model.disabled=effort.disabled=true}
}
function nav(label,offset,kind){const el=node('button',label);el.onclick=()=>{if(kind==='tasks')taskOffset=offset;else if(kind==='reports')reportOffset=offset;else projectReportOffset=offset;refresh()};return el}
function appendLinks(card,refs,taskId=null){for(const ref of refs){let u;try{if(/^https?:\/\//i.test(ref))u=new URL(ref)}catch{}if(u&&['http:','https:'].includes(u.protocol)){const a=node('a',ref);a.href=u.href;a.rel='noreferrer noopener';card.append(a,node('br',''));continue}if(taskId){const button=node('button','Download declared local evidence');button.onclick=async()=>{button.disabled=true;try{const bundle=await api(`/api/tasks/${encodeURIComponent(taskId)}/bundle`),declared=bundle.references.find(x=>x.path===ref);if(!declared){button.replaceWith(node('span',`Local evidence not declared for task: ${ref}`));return}const response=await fetch(`/api/tasks/${encodeURIComponent(taskId)}/references/${encodeURIComponent(declared.task_id)}/${encodeURIComponent(declared.id)}`,{headers:{Authorization:`Bearer ${token.value}`,Accept:'text/plain'},cache:'no-store'});if(!response.ok)throw Error(`Evidence returned ${response.status}`);const blob=await response.blob(),url=URL.createObjectURL(blob),a=node('a',`Download ${declared.path}`);a.href=url;a.download=declared.path.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);button.replaceWith(a)}catch(e){button.replaceWith(node('span',`Local evidence unavailable: ${e.message}`))}};card.append(button,node('br',''))}else card.append(node('span',`Local evidence not linked (no declared task reference): ${ref}`),node('br',''))}}
function drawGraph(graph){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),nodes=graph.nodes||[],edges=graph.edges||[],byId=new Map(),cols={project:50,task:300,claim:570,dispatch:570,source:850,schema:850,config:850,test:850,artifact:850,evidence:850,cleanup:850};svg.setAttribute('role','img');svg.setAttribute('aria-label',`Dependency graph with ${nodes.length} nodes and ${edges.length} typed edges`);
 const rows={};for(const item of nodes){const col=cols[item.kind]||850,row=rows[col]||0;rows[col]=row+1;const pos={x:col,y:45+row*58};byId.set(item.id,pos)}svg.setAttribute('viewBox',`0 0 1100 ${Math.max(250,...Array.from(byId.values(),p=>p.y+50))}`);
 for(const edge of edges){const a=byId.get(edge.from),b=byId.get(edge.to);if(!a||!b)continue;const line=document.createElementNS(svg.namespaceURI,'line');line.setAttribute('x1',a.x+70);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','edge');svg.append(line)}
 for(const item of nodes){const p=byId.get(item.id);if(!p)continue;const rect=document.createElementNS(svg.namespaceURI,'rect');rect.setAttribute('x',p.x);rect.setAttribute('y',p.y-17);rect.setAttribute('width',140);rect.setAttribute('height',34);rect.setAttribute('rx',6);rect.setAttribute('class',item.kind==='task'?'task-node':(['source','schema','config','test','artifact','evidence','cleanup'].includes(item.kind)?'ref-node':'meta-node'));svg.append(rect);const label=document.createElementNS(svg.namespaceURI,'text');label.setAttribute('x',p.x+6);label.setAttribute('y',p.y-2);label.setAttribute('class','node-label');label.textContent=`${item.kind}: ${String(item.label||'').slice(0,19)}`;svg.append(label);if(item.status){const sub=document.createElementNS(svg.namespaceURI,'text');sub.setAttribute('x',p.x+6);sub.setAttribute('y',p.y+11);sub.setAttribute('class','node-label');sub.textContent=String(item.status);svg.append(sub)}}return svg}
async function showBundle(taskId){selectedTask=taskId;const detail=document.querySelector('#detail');detail.replaceChildren(node('p','Loading task bundle…'));try{const bundle=await api(`/api/tasks/${encodeURIComponent(taskId)}/bundle`);detail.replaceChildren(node('h3',`Task ${taskId}`),node('p',`Closure revision ${bundle.revision} · freshness ${bundle.freshness.current?'current':'needs attention'} · ${bundle.freshness.required_gaps} required reference gaps`));for(const report of bundle.directed_reports||[]){const card=document.createElement('article');card.append(node('h4','Latest task-directed instruction'),node('p',`State ${report.state||'unknown'}`),node('p',report.detail||''),node('p',`From ${report.reporter||'unknown'} (${report.reporter_thread_id||'unknown'}) · ${report.kind||'report'} · occurred ${report.occurred_at||'unknown'} · recorded ${report.recorded_at||'unknown'}`));if(report.source){card.append(node('p',`Source ${report.source}`));if(/^https?:\/\//i.test(report.source))appendLinks(card,[report.source],taskId)}appendLinks(card,report.evidence||[],taskId);detail.append(card)}detail.append(node('h4','Task dependency graph'),drawGraph(bundle.graph));for(const task of bundle.tasks){const card=document.createElement('article');card.append(node('strong',`${task.id} · ${task.status} · ${task.worker}`),node('p',`Claim ${task.beads_ref} · Dispatch ${task.dispatch_id||'not issued'} · source ${task.source_digest}`),node('p',task.prompt));detail.append(card)}if(bundle.missing_dependencies.length)detail.append(node('p',`Missing dependencies: ${bundle.missing_dependencies.join(', ')}`));for(const ref of bundle.references){const card=document.createElement('article');card.append(node('strong',`${ref.kind} · ${ref.path}`),node('p',`${ref.status}${ref.status_reason?` · ${ref.status_reason}`:''} · ${ref.required?'required':'optional'} · revision ${ref.revision||'unknown'} · updated ${ref.updated_at||'unknown'}`));if(ref.sha256)card.append(node('code',`sha256 ${ref.sha256}`));appendLinks(card,[ref.path],taskId);detail.append(card)}}catch(e){detail.replaceChildren(node('p',e.message))}finally{detail.focus({preventScroll:true});detail.scrollIntoView({block:'start',behavior:'smooth'})}}
async function refresh(){view.replaceChildren();try{const q=new URLSearchParams({offset:taskOffset,limit:100,report_offset:reportOffset,report_limit:100,project_report_offset:projectReportOffset,project_report_limit:100});const [data,graph]=await Promise.all([api(`/api/status?${q}`),api(`/api/graph?offset=${taskOffset}&limit=100`)]);const b=data.bounds;freshness.textContent=`Revision ${data.revision} · checkpoint ${data.checkpoint_id||'unknown'} · observed ${new Date(data.observed_at).toLocaleString()} · ${b.total_tasks} tasks · ${b.total_reports} reports · recovery ${data.recovery_required?'required':'clear'}`;
 const board=document.createElement('section');board.append(node('h2',`Board · ${data.project.project_id}`),node('p',`Linear ${data.project.linear_ref} · execution claim ${data.project.beads_ref}`));for(const task of data.tasks){const card=document.createElement('article');card.append(node('strong',`${task.id} · ${task.status} · ${task.worker}`),node('p',`Dependencies ${(task.dependencies||[]).join(', ')||'none'} · claim ${task.beads_ref||'unknown'} · dispatch ${task.dispatch_id||'unknown'}`));if(task.latest_report)card.append(node('p',`Latest ${task.latest_report.kind}: ${task.latest_report.state} · ${task.latest_report.occurred_at} · recorded ${task.latest_report.recorded_at}`));const open=node('button','Open task bundle');open.onclick=()=>showBundle(task.id);card.append(open);board.append(card)}view.append(board);view.append(node('p',`${b.omitted_reports} omitted_reports · ${b.omitted_project_reports} omitted_project_reports · ${b.omitted_worker_roles} omitted_worker_roles`));
 const graphSection=document.createElement('details');graphSection.append(node('summary',`Full project graph · ${graph.graph.nodes.length} nodes · ${graph.graph.edges.length} typed edges`));graphSection.addEventListener('toggle',()=>{if(graphSection.open&&!graphSection.dataset.rendered){graphSection.append(drawGraph(graph.graph));graphSection.dataset.rendered='true'}});view.append(graphSection);
 const detail=document.createElement('section');detail.id='detail';detail.tabIndex=-1;detail.append(node('h2','Task and artifact drilldown'));view.append(detail);if(selectedTask)showBundle(selectedTask);
 const reportSection=document.createElement('section');reportSection.append(node('h2','Task reports'));for(const r of data.reports){const card=document.createElement('article');card.append(node('strong',`${r.kind} · ${r.task_id} · ${r.reporter} · ${r.state}${r.stale?' · stale':''}`),node('p',`${r.detail} · occurred ${r.occurred_at} · recorded ${r.recorded_at}`));appendLinks(card,[r.source,...(r.evidence||[])],r.task_id);reportSection.append(card)}if(b.previous_report_offset!==null)reportSection.append(nav('Newer reports',b.previous_report_offset,'reports'));if(b.next_report_offset!==null)reportSection.append(nav('Older reports',b.next_report_offset,'reports'));view.append(reportSection);
 const projectSection=document.createElement('section');projectSection.append(node('h2','Project observations'));for(const r of data.project_reports){const card=document.createElement('article');card.append(node('strong',`${r.kind} · ${r.reporter} · ${r.work_item} · ${r.state}${r.stale?' · stale':''}`),node('p',`${r.detail} · occurred ${r.occurred_at} · recorded ${r.recorded_at}`));appendLinks(card,[r.source,...(r.evidence||[])]);projectSection.append(card)}if(b.previous_project_report_offset!==null)projectSection.append(nav('Newer observations',b.previous_project_report_offset,'project'));if(b.next_project_report_offset!==null)projectSection.append(nav('Older observations',b.next_project_report_offset,'project'));view.append(projectSection);
 if(b.offset>0)view.append(nav('Previous task page',Math.max(0,b.offset-b.limit),'tasks'));if(b.next_offset!==null)view.append(nav('Next task page',b.next_offset,'tasks'));
 }catch(e){freshness.textContent=e.message}}
document.querySelector('#refresh').onclick=()=>{refresh();loadRouting()};
</script>
</html>
