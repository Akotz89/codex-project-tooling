<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project coordinator status</title>
<style>
body{font:15px system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#18212b}input,button{font:inherit;padding:.5rem}a{color:#145cb3}.muted{color:#536273}button{margin:.25rem}
</style>
<h1>Project coordinator status</h1>
<p class="muted">Read-only view. Reports are participant observations; Root acceptance is separate.</p>
<label>API bearer token <input id="token" type="password" autocomplete="off"></label>
<button id="refresh">Refresh</button>
<p id="freshness" class="muted" aria-live="polite">Not yet loaded.</p>
<main id="view"></main>
<script>
const token=document.querySelector('#token'),view=document.querySelector('#view'),freshness=document.querySelector('#freshness');
let taskOffset=0,reportOffset=0;
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
function button(text,offset,kind){const el=node('button',text);el.onclick=()=>{if(kind==='task')taskOffset=offset;else reportOffset=offset;refresh()};return el}
async function refresh(){view.replaceChildren();try{
 const query=new URLSearchParams({offset:taskOffset,limit:100,report_offset:reportOffset,report_limit:100});
 const r=await fetch(`/api/status?${query}`,{headers:{Authorization:`Bearer ${token.value}`},cache:'no-store'});
 if(!r.ok)throw Error(`API returned ${r.status}`);
 const data=await r.json(),bounds=data.bounds;
 freshness.textContent=`Checkpoint ${data.checkpoint_id||'unknown'} · observed ${new Date(data.observed_at).toLocaleString()} · ${bounds.total_tasks} tasks · ${bounds.total_reports} reports`;
 view.append(node('h2',`Project ${data.project.project_id}`),node('p',`Root: ${data.project.root}`),node('h2','Tasks'));
 for(const task of data.tasks){const section=document.createElement('section');section.append(node('h3',`${task.id} · ${task.status} · ${task.worker}`),node('p',`Dependencies: ${(task.dependencies||[]).join(', ')||'none'} · Claim: ${task.beads_ref||'unknown'} · Dispatch: ${task.dispatch_id||'unknown'}`));if(task.latest_report)section.append(node('p',`Latest: ${task.latest_report.kind} · ${task.latest_report.state} · ${task.latest_report.occurred_at} (recorded ${task.latest_report.recorded_at})`));view.append(section)}
 const taskNav=document.createElement('nav');taskNav.setAttribute('aria-label','Task pages');
 taskNav.append(node('span',`Tasks ${bounds.offset+1}–${Math.min(bounds.offset+data.tasks.length,bounds.total_tasks)} of ${bounds.total_tasks}`));
 if(bounds.offset>0)taskNav.append(button('Newer tasks',Math.max(0,bounds.offset-bounds.limit),'task'));
 if(bounds.next_offset!==null)taskNav.append(button('Older tasks',bounds.next_offset,'task'));
 view.append(taskNav,node('h2','Reports'));
 const reportNav=document.createElement('nav');reportNav.setAttribute('aria-label','Report pages');
 const first=bounds.total_reports?bounds.report_offset+1:0,last=bounds.report_offset+data.reports.length;
 reportNav.append(node('span',`Showing reports ${first}–${last} of ${bounds.total_reports} newest-first`));
 if(bounds.previous_report_offset!==null)reportNav.append(button('Newer reports',bounds.previous_report_offset,'report'));
 if(bounds.next_report_offset!==null)reportNav.append(button('Older reports',bounds.next_report_offset,'report'));
 if(bounds.omitted_reports)reportNav.append(node('span',` ${bounds.omitted_reports} reports on other pages.`));
 view.append(reportNav);
 for(const report of data.reports){const section=document.createElement('section');section.append(node('h3',`${report.kind} · ${report.task_id} · ${report.reporter} (${report.reporter_thread_id||'unknown'}) · ${report.state}${report.stale?' · stale':''}`),node('p',`${report.detail} — occurred ${report.occurred_at}; recorded ${report.recorded_at}`));for(const ref of [report.source,...(report.evidence||[])]){if(typeof ref!=='string')continue;try{const u=new URL(ref,location.href);if(['http:','https:'].includes(u.protocol)){const a=node('a',ref);a.href=u.href;a.rel='noreferrer noopener';section.append(a,node('br',''))}}catch{}}view.append(section)}
 }catch(e){freshness.textContent=e.message}}
document.querySelector('#refresh').onclick=refresh;
</script>
</html>
