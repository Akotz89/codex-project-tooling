[project]
name = "project-coordinator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.16", "langgraph-checkpoint-sqlite==3.1.2"]

[project.scripts]
project-coordinator = "project_coordinator.cli:main"

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_coordinator = ["status.html"]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
